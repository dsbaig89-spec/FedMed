[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedmed"
version = "0.1.0"
description = "FedMed Cross-Silo Federated Learning Engine"
requires-python = ">=3.12"

dependencies = [
    "flwr[simulation]"
]

[tool.hatch.build.targets.wheel]
packages = ["federated"]

[tool.flwr.app]
publisher = "fedmed"

[tool.flwr.app.components]
serverapp = "federated.server.server_app:app"
clientapp = "federated.clients.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
local-epochs = 1
batch-size = 1
learning-rate = 0.001


